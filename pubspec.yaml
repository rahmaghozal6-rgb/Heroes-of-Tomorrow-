name: heroes_of_tomorrow
description: Heroes of Tomorrow - Educational App for Kids
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  firebase_core: ^2.24.2
  cloud_firestore: ^4.14.0
  firebase_auth: ^4.16.0

  google_generative_ai: ^0.4.0

  flutter_tts: ^3.8.5
  speech_to_text: ^6.6.0

  audioplayers: ^5.2.1

  rive: ^0.12.4

  provider: ^6.1.1
  shared_preferences: ^2.2.2

  google_fonts: ^6.1.0
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/lessons/
    - assets/images/tests/
    - assets/sounds/
    - assets/animations/
